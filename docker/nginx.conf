upstream backend  { server backend:80; }
upstream frontend { server frontend:3000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # NextAuth routes → frontend (doit être AVANT /api/)
    # Uniquement les sous-routes internes de NextAuth : /api/auth/login, /api/auth/me,
    # /api/auth/logout et /api/auth/register appartiennent à l'API Laravel et doivent
    # tomber dans le bloc /api/ plus bas.
    location ~ ^/api/auth/(session|signin|signout|callback|csrf|providers|error|verify-request) {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API Laravel
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Laravel storage (images, docs)
    location /storage/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Sanctum CSRF
    location /sanctum/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Frontend Next.js (tout le reste)
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
